# Controls the tendency of the kernel to reclaim the memory which is used for
# caching of directory and inode objects. Higher is faster.
# https://www.kernel.org/doc/html/v7.2/admin-guide/sysctl/vm.html#vfs-cache-pressure
# https://www.kernel.org/doc/html/v7.2/admin-guide/sysctl/vm.html#vfs-cache-pressure-denom
vm.vfs_cache_pressure = 150
vm.vfs_cache_pressure_denom = 100

# A percentage of total available memory that contains free pages and
# reclaimable pages, the number of pages at which the background kernel flusher
# threads will start writing out dirty data. The total available memory is not
# equal to total system memory.
# https://www.kernel.org/doc/html/v7.2/admin-guide/sysctl/vm.html#dirty-background-ratio
vm.dirty_background_ratio = 5

# A percentage of total available memory that contains free pages and
# reclaimable pages, the number of pages at which a process which is generating
# disk writes will itself start writing out dirty data. The total available
# memory is not equal to total system memory.
# https://www.kernel.org/doc/html/v7.2/admin-guide/sysctl/vm.html#dirty-ratio
vm.dirty_ratio = 10
