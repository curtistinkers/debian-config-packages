# /etc/security/pwquality.conf.d/50-system-hardening.conf
# Baseline password complexity settings for hardened systems

# Minimum length
minlen = 12

# Require at least 1 digit, 1 uppercase, 1 lowercase, and 1 special char
dcredit = -1
ucredit = -1
lcredit = -1
ocredit = -1

# Maximum repeating characters allowed
maxrepeat = 3

# Check password against current username in reverse
usercheck = 1

# Enforce checks even for root password changes
enforce_for_root
