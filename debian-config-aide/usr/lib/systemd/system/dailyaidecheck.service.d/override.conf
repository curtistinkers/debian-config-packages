[Unit]
AssertPathExists=/etc/aide/aide.conf
AssertPathExists=/var/lib/aide/
AssertPathExists=/var/log/aide/

[Service]
# These cannot be sandboxed or the script will fail
ProtectProc=default
ProcSubset=all
ProtectHome=no
ProtectKernelModules=no
ProtectKernelLogs=no
PrivateUsers=no
PrivateDevices=no
NoNewPrivileges=no
RestrictSUIDSGID=no

# Filesystem Restrictions
ProtectSystem=strict
PrivateTmp=yes
ReadWritePaths=/var/lib/aide/ /var/log/aide/
ReadWritePaths=/var/spool/exim4/input/ /var/spool/exim4/msglog/ /var/log/exim4/mainlog
ReadOnlyPaths=/etc/aide/ /etc/aide/aide.conf /etc/aide/aide.conf.d/
ProtectControlGroups=yes
ProtectKernelTunables=yes
RemoveIPC=yes
UMask=0077

# Kernel & Privilege Restrictions
# Add SETUID & SETGID for mail access
AmbientCapabilities=CAP_DAC_READ_SEARCH CAP_AUDIT_WRITE CAP_SETUID CAP_SETGID
CapabilityBoundingSet=CAP_DAC_READ_SEARCH CAP_AUDIT_WRITE CAP_SETUID CAP_SETGID
RestrictRealtime=yes
RestrictNamespaces=yes

# Network Settings
PrivateNetwork=no
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
ProtectHostname=yes
IPAddressAllow=localhost
IPAddressDeny=any

# System Architecture Protections
MemoryDenyWriteExecute=yes
LockPersonality=yes
SystemCallFilter=@system-service
SystemCallArchitectures=native

# Device and Hardware Isolation
ProtectClock=yes
